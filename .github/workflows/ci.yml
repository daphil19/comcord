name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android, JVM, JS, Wasm, and tests
        run: |
          ./gradlew \
            :composeApp:assembleDebug \
            :composeApp:compileKotlinJvm \
            :composeApp:compileKotlinJs \
            :composeApp:compileKotlinWasmJs \
            :composeApp:allTests

  verify-macos:
    name: Verify macOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify iOS simulator build
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

  release-android:
    name: Release Android
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android release artifacts
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  release-desktop-native:
    name: Release Desktop Native (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop native package
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Archive desktop native package on Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-assets
          tar -czf release-assets/desktop-native-${{ matrix.os }}.tar.gz -C composeApp/build/compose/binaries main-release

      - name: Archive desktop native package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path composeApp/build/compose/binaries/main-release/* -DestinationPath release-assets/desktop-native-${{ matrix.os }}.zip

      - name: Upload desktop native package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-native-${{ matrix.os }}
          path: |
            release-assets/desktop-native-${{ matrix.os }}.tar.gz
            release-assets/desktop-native-${{ matrix.os }}.zip
          if-no-files-found: error

  release-desktop-jar:
    name: Release Desktop JAR
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop release JAR
        run: ./gradlew :composeApp:packageReleaseUberJarForCurrentOS

      - name: Upload desktop release JAR
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jar
          path: |
            composeApp/build/compose/jars/*.jar
            composeApp/build/libs/*jvm*.jar
          if-no-files-found: error

  release-web:
    name: Release Web
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build web production bundles
        run: ./gradlew :composeApp:jsBrowserDistribution :composeApp:wasmJsBrowserDistribution :composeApp:composeCompatibilityBrowserDistribution

      - name: Archive web release bundle
        run: |
          mkdir -p release-assets
          tar -czf release-assets/web-distribution.tar.gz -C composeApp/build dist

      - name: Upload web release bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: release-assets/web-distribution.tar.gz
          if-no-files-found: error

  release-ios-framework:
    name: Release iOS Frameworks
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS release frameworks
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 :composeApp:linkReleaseFrameworkIosSimulatorArm64

      - name: Archive iOS release frameworks
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework release-assets/ComposeApp-iosArm64-framework.zip
          ditto -c -k --sequesterRsrc --keepParent composeApp/build/bin/iosSimulatorArm64/releaseFramework/ComposeApp.framework release-assets/ComposeApp-iosSimulatorArm64-framework.zip

      - name: Upload iOS release frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks
          path: release-assets/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-android
      - release-desktop-native
      - release-desktop-jar
      - release-web
      - release-ios-framework
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.apk
            release-assets/**/*.aab
            release-assets/**/*.jar
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.exe
            release-assets/**/*.pkg
