name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

defaults:
  run:
    shell: bash

jobs:
  verify-linux:
    name: Verify Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Explicitly exclude the retired legacy SDK tools package.
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Verify Android, JVM, and unit tests
        run: |
          ./gradlew \
            :androidApp:assembleDebug \
            :composeApp:compileKotlinJvm \
            :composeApp:compileKotlinJs \
            :composeApp:compileKotlinWasmJs \
            :composeApp:jsBrowserProductionWebpack \
            :composeApp:wasmJsBrowserProductionWebpack \
            :composeApp:jvmTest \
            :androidApp:testDebugUnitTest \
            :androidApp:testReleaseUnitTest

      - name: Verify JS and Wasm browser tests
        run: |
          xvfb-run ./gradlew \
            :composeApp:jsBrowserTest \
            :composeApp:wasmJsBrowserTest

  verify-macos:
    name: Verify macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify iOS simulator build and tests
        run: |
          ./gradlew \
            :composeApp:linkDebugFrameworkIosSimulatorArm64 \
            :composeApp:iosSimulatorArm64Test

  release-android:
    name: Release Android
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Explicitly exclude the retired legacy SDK tools package.
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build Android release artifacts
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  release-desktop-native:
    name: Release Desktop Native (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build desktop native package
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Archive desktop native package on Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-assets
          tar -czf release-assets/desktop-native-${{ matrix.os }}.tar.gz -C composeApp/build/compose/binaries main-release

      - name: Archive desktop native package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path composeApp/build/compose/binaries/main-release/* -DestinationPath release-assets/desktop-native-${{ matrix.os }}.zip

      - name: Upload desktop native package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-${{ matrix.os }}
          path: |
            release-assets/desktop-native-${{ matrix.os }}.tar.gz
            release-assets/desktop-native-${{ matrix.os }}.zip
          if-no-files-found: error

  release-desktop-jar:
    name: Release Desktop JAR
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build desktop release JAR
        run: ./gradlew :composeApp:packageReleaseUberJarForCurrentOS

      - name: Upload desktop release JAR
        uses: actions/upload-artifact@v7
        with:
          name: desktop-jar
          path: |
            composeApp/build/compose/jars/*.jar
            composeApp/build/libs/*jvm*.jar
          if-no-files-found: error

  release-web:
    name: Release Web
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build web production bundles
        run: ./gradlew :composeApp:jsBrowserDistribution :composeApp:wasmJsBrowserDistribution :composeApp:composeCompatibilityBrowserDistribution

      - name: Archive web release bundle
        run: |
          mkdir -p release-assets
          tar -czf release-assets/web-distribution.tar.gz -C composeApp/build dist

      - name: Upload web release bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: release-assets/web-distribution.tar.gz
          if-no-files-found: error

  release-ios-framework:
    name: Release iOS Frameworks
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-linux
      - verify-macos
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build iOS release frameworks
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 :composeApp:linkReleaseFrameworkIosSimulatorArm64

      - name: Archive iOS release frameworks
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework release-assets/ComposeApp-iosArm64-framework.zip
          ditto -c -k --sequesterRsrc --keepParent composeApp/build/bin/iosSimulatorArm64/releaseFramework/ComposeApp.framework release-assets/ComposeApp-iosSimulatorArm64-framework.zip

      - name: Upload iOS release frameworks
        uses: actions/upload-artifact@v7
        with:
          name: ios-frameworks
          path: release-assets/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-android
      - release-desktop-native
      - release-desktop-jar
      - release-web
      - release-ios-framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
          mapfile -t release_files < <(find release-assets -type f \( \
            -name '*.apk' -o \
            -name '*.aab' -o \
            -name '*.jar' -o \
            -name '*.zip' -o \
            -name '*.tar.gz' \
          \))
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release artifacts found"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${release_files[@]}" --clobber
