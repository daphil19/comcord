#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8G
# Kotlin 2.4.21's incremental Wasm linker emits invalid GC reference types with
# the Trixnity dependency graph. Apply to every Wasm binary, including tests.
# Re-enable only after validateWasmDevelopment and browser startup pass on a fixed compiler.
kotlin.incremental.wasm=false
#Gradle
org.gradle.jvmargs=-Xmx8G -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
