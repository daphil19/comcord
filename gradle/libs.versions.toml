[versions]
# Kotlin 2.4.21 documents AGP support through 9.3.1 (newer 9.4.x is held back).
agp = "9.1.1" # latest supported version in intellij
compose-multiplatform = "1.12.2"
compose-material3 = "1.9.0"
kotlin = "2.4.21"

android-compileSdk = "37"
android-minSdk = "28"
android-targetSdk = "37"
androidx-activityCompose = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-constraintlayout = "2.2.2"
androidx-core-ktx = "1.19.1"
androidx-espresso-core = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-material = "1.14.0"
androidx-test-junit = "1.3.0"
junit = "4.13.2"
kotlinx-coroutines = "1.11.0"
jdk = "17"
ktlint = "1.8.0"
# Match trixnity-messenger 4.10.3; Ktor 3.6 is outside its published baseline.
ktor = "3.5.2"
decompose = "3.5.0" # https://github.com/arkivanov/Decompose/releases
copyWebpackPlugin = "14.0.0" # https://github.com/webpack-contrib/copy-webpack-plugin/releases
terserWebpackPlugin = "5.6.1"
# Match Trixnity 4.10.3: newer wrappers remove the IndexedDB createIndex ABI
# used by its precompiled Wasm libraries (login fails with IrLinkageError).
kotlinWrappers = "2026.6.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "androidx-material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
trixnity-messenger = { module = "de.connect2x.trixnity.messenger:trixnity-messenger", version = "4.10.3" }
ktlint-compose = "io.nlopez.compose.rules:ktlint:0.6.8"
#ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
#ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-extensions = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
kotlin-wrappers-bom = {group = "org.jetbrains.kotlin-wrappers", name = "kotlin-wrappers-bom", version.ref = "kotlinWrappers" }
kotlin-browser = {group = "org.jetbrains.kotlin-wrappers", name = "kotlin-browser", version.ref = "kotlinWrappers" }

[bundles]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
gradle-versions = { id = "io.github.ben-manes.versions", version = "0.66.0" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
# Detekt 2 supports Kotlin 2.x and AGP 9 built-in Kotlin without legacy opt-outs.
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }
